[build-system]
requires = ["setuptools>=61,<76", "wheel>=0.37,<0.45"]
build-backend = "setuptools.build_meta"

[project]
name = "mdhg-net"
version = "0.4.0"
description = "TensorFlow multi-scale dynamic hypergraph network for probabilistic balance forecasting"
readme = "README.md"
requires-python = ">=3.9,<3.10"
dependencies = [
    "tensorflow==2.9.1", "keras==2.9.0", "numpy==1.23.5",
    "protobuf==3.19.6", "h5py==3.8.0", "tensorboard==2.9.1"
]

[project.optional-dependencies]
research = [
    "pandas==1.5.3", "scipy==1.9.3", "scikit-learn==1.2.2",
    "matplotlib==3.7.5", "seaborn==0.12.2", "PyYAML==6.0.1",
    "tqdm==4.66.5", "openpyxl==3.1.2"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["mdhg_net*"]
